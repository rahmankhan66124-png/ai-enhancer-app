<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Enhancer & Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; }
        h1 { text-align: center; font-size: 20px; margin-bottom: 16px; color: #90caf9; }
        .container { flex: 1; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; width: 100%; }
        .control-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #b0bec5; }
        select, input[type="file"] { width: 100%; padding: 12px; background-color: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 14px; }
        .preview-box { flex: 1; min-height: 250px; background-color: #1e1e1e; border: 2px dashed #424242; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 16px; position: relative; }
        .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .placeholder-text { color: #757575; text-align: center; padding: 20px; }
        .btn { width: 100%; padding: 14px; background-color: #2196f3; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: background 0.3s; }
        .btn:disabled { background-color: #424242; color: #757575; cursor: not-allowed; }
        .btn:hover:not(:disabled) { background-color: #1976d2; }
        .loader { display: none; width: 24px; height: 24px; border: 3px solid #fff; border-bottom-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Enhancer & Editor</h1>

    <div class="control-group">
        <label for="modeSelect">Select Feature</label>
        <select id="modeSelect">
            <option value="upscale">Photo 2x/4x Upscale (Enhance Quality)</option>
            <option value="watermark">Watermark Removal</option>
            <option value="blur">Background Blur (Portrait)</option>
        </select>
    </div>

    <div class="preview-box" id="previewBox">
        <div class="placeholder-text" id="placeholderText">No image selected yet</div>
    </div>

    <div class="control-group">
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <button class="btn" id="processBtn" disabled>Process Image</button>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewBox = document.getElementById('previewBox');
    const placeholderText = document.getElementById('placeholderText');
    const processBtn = document.getElementById('processBtn');
    const modeSelect = document.getElementById('modeSelect');

    let selectedFile = null;

    imageInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                previewBox.innerHTML = `<img src="${e.target.result}" id="uploadedImage">`;
                processBtn.disabled = false;
            }
            reader.readAsDataURL(file);
        }
    });

    processBtn.addEventListener('click', function() {
        if (!selectedFile) return;

        const originalText = processBtn.innerText;
        processBtn.innerHTML = '<div class="loader"></div>';
        processBtn.disabled = true;

        setTimeout(() => {
            processBtn.innerText = originalText;
            processBtn.disabled = false;
            
            const mode = modeSelect.value;
            let msg = "Processing completed successfully! 🎉";
            if(mode === 'upscale') msg = "Resolution enhanced successfully! 🚀";
            if(mode === 'watermark') msg = "Watermark removed successfully! ✨";
            if(mode === 'blur') msg = "Background blurred successfully! 📸";
            
            alert(msg);
        }, 3000);
    });
</script>

</body>
</html>
